<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6b7f"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e8833a"/>
    </marker>
  </defs>

  <rect width="680" height="520" fill="#f7f9fc"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">招聘数据自动化 AI 应用 · 架构图</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#7a8aa0">非结构化群消息 / 随手记  →  AI 结构化抽取  →  实时可视化看板</text>

  <!-- Layer 1 -->
  <rect x="40" y="74" width="600" height="74" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="60" y="98" font-size="13" font-weight="700" fill="#1a56db">① 输入 / 数据源层</text>
  <rect x="60" y="106" width="170" height="30" rx="7" fill="#fff" stroke="#4285f4"/><text x="145" y="125" text-anchor="middle" font-size="12" fill="#1f2d3d">企业微信群机器人</text>
  <rect x="255" y="106" width="170" height="30" rx="7" fill="#fff" stroke="#4285f4"/><text x="340" y="125" text-anchor="middle" font-size="12" fill="#1f2d3d">HR 网页 / IM 录入</text>
  <rect x="450" y="106" width="170" height="30" rx="7" fill="#fff" stroke="#4285f4"/><text x="535" y="125" text-anchor="middle" font-size="12" fill="#1f2d3d">语音 / 附件转写</text>

  <!-- arrow 1->2 -->
  <line x1="340" y1="148" x2="340" y2="172" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="40" y="174" width="600" height="86" rx="12" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="60" y="198" font-size="13" font-weight="700" fill="#1d7a43">② AI 解析层（大模型 + 提示词工程）</text>
  <rect x="60" y="206" width="560" height="30" rx="7" fill="#fff" stroke="#2e9e5b"/><text x="340" y="225" text-anchor="middle" font-size="12" fill="#1f2d3d">非结构化文本 → 候选人 / 岗位 / 阶段 / 状态 / 时间 / 面试官 + 置信度校验</text>
  <text x="60" y="252" font-size="11" fill="#1d7a43">模型：本地 Ollama(Qwen2.5-7B) 或 免费云额度(Doubao / Qwen / 智谱GLM)</text>

  <!-- arrow 2->3 -->
  <line x1="340" y1="260" x2="340" y2="284" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="40" y="286" width="600" height="70" rx="12" fill="#fff4e6" stroke="#e8833a" stroke-width="1.5"/>
  <text x="60" y="310" font-size="13" font-weight="700" fill="#c2671c">③ 数据层（单一可信源）</text>
  <rect x="60" y="318" width="270" height="30" rx="7" fill="#fff" stroke="#e8833a"/><text x="195" y="337" text-anchor="middle" font-size="12" fill="#1f2d3d">腾讯文档智能表（零学习成本）</text>
  <rect x="350" y="318" width="270" height="30" rx="7" fill="#fff" stroke="#e8833a"/><text x="485" y="337" text-anchor="middle" font-size="12" fill="#1f2d3d">轻量库 / localStorage（Demo）</text>

  <!-- arrow 3->4 -->
  <line x1="340" y1="356" x2="340" y2="380" stroke="#5b6b7f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4 -->
  <rect x="40" y="382" width="600" height="86" rx="12" fill="#f3eaff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="60" y="406" font-size="13" font-weight="700" fill="#6d28d9">④ 展示 / 应用层</text>
  <rect x="60" y="414" width="170" height="30" rx="7" fill="#fff" stroke="#8b5cf6"/><text x="145" y="433" text-anchor="middle" font-size="12" fill="#1f2d3d">实时看板(漏斗/转化)</text>
  <rect x="255" y="414" width="170" height="30" rx="7" fill="#fff" stroke="#8b5cf6"/><text x="340" y="433" text-anchor="middle" font-size="12" fill="#1f2d3d">节点超时自动提醒</text>
  <rect x="450" y="414" width="170" height="30" rx="7" fill="#fff" stroke="#8b5cf6"/><text x="535" y="433" text-anchor="middle" font-size="12" fill="#1f2d3d">周报自动生成</text>
  <text x="60" y="460" font-size="11" fill="#6d28d9">可视化：ECharts / Chart.js（开源免费）</text>

  <!-- feedback loop -->
  <path d="M640,425 C672,425 672,150 612,118" fill="none" stroke="#e8833a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowB)"/>
  <text x="648" y="275" font-size="10" fill="#c2671c" transform="rotate(-90 648 275)">反馈闭环：异常/待确认回流 HR</text>

  <text x="340" y="500" text-anchor="middle" font-size="11" fill="#7a8aa0">成本：模型调用(免费额度) + 腾讯文档 + 企业微信机器人 + 开源可视化 ≈ ¥0 / 月</text>
</svg>
